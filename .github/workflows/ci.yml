name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go-version-file reads go.mod, so the toolchain can never drift from what
      # the module requires. Naming a version here as well is how a matrix ends
      # up testing a toolchain the module cannot build with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: ripgrep
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: install frozen explorer dependencies
        working-directory: web/explorer
        run: bun install --frozen-lockfile
      - name: install pinned Chromium runtime
        working-directory: web/explorer
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            bunx playwright install --with-deps chromium
          else
            bunx playwright install chromium
          fi
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z --cached --others --exclude-standard -- '*.go' | xargs -0 gofmt -l)
          if [ -n "${unformatted}" ]; then
            echo "Files need formatting:"
            echo "${unformatted}"
            exit 1
          fi
      - name: identity residue
        run: scripts/tests/run-name-residue.sh
      - name: GitHub workflow lint
        if: matrix.os == 'ubuntu-latest'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -no-color
      - name: artifact safety
        run: scripts/tests/run-artifact-safety.sh
      - name: go vet
        run: scripts/tests/list-project-go-packages.sh | xargs go vet
      - name: staticcheck 2026.2.1
        run: scripts/tests/list-project-go-packages.sh | xargs go run honnef.co/go/tools/cmd/staticcheck@2026.2.1
      - name: govulncheck 1.6.0
        if: matrix.os == 'ubuntu-latest'
        run: scripts/tests/run-vulnerability-scan.sh
      - name: go test
        run: scripts/tests/list-project-go-packages.sh | grep -v '/internal/stress$' | xargs go test
      - name: stress tests (opt-in)
        if: vars.EVALWITNESS_ENABLE_STRESS_TESTS == 'true'
        run: go test -count=1 -timeout 30m ./internal/stress
      - name: coding-agent-only formal study
        run: scripts/audits/run-agent-only-study.sh
      - name: MCP 2026-07-28 and Best-of-N product conformance
        if: matrix.os == 'ubuntu-latest'
        run: scripts/tests/run-product-conformance.sh
      - name: bounded fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: scripts/tests/run-fuzz-smoke.sh
      - name: go test -race (opt-in deterministic shards)
        if: vars.EVALWITNESS_ENABLE_RACE_TESTS == 'true'
        run: scripts/tests/run-race.sh
      - name: go build
        run: go build -buildvcs=false -o /tmp/evalwitness ./cmd/evalwitness
      - name: hard-network replay, capsule, claimcheck, and explorer reproduction
        run: scripts/evals/reproduce-public-evidence.sh --profile full
      - name: complete unsigned development release candidate
        if: matrix.os == 'ubuntu-latest'
        run: scripts/build/build-release-candidate.sh --destination "${RUNNER_TEMP}/evalwitness-release-candidate"

  build-matrix:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          go build -buildvcs=false -ldflags="-s -w -buildid= -funcalign=8" -trimpath -o "dist/evalwitness-${{ matrix.os }}-${{ matrix.arch }}${ext}" ./cmd/evalwitness
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evalwitness-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
