name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: ripgrep
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: install frozen explorer dependencies
        working-directory: web/explorer
        run: bun install --frozen-lockfile
      - name: install pinned Chromium runtime
        working-directory: web/explorer
        run: bunx playwright install --with-deps chromium
      - name: bind tag to the product version
        run: |
          expected_tag="v$(go run ./cmd/evalwitness version)"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} differs from product version ${expected_tag}" >&2
            exit 1
          fi
      - name: test
        run: scripts/tests/run-tests.sh
      - name: build complete release candidate
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          candidate="${RUNNER_TEMP}/evalwitness-${GITHUB_REF_NAME}"
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "RELEASE_SIGNING_KEY is required for a published release" >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/release-signing-key.hex"
          printf '%s' "${RELEASE_SIGNING_KEY}" > "${key_file}"
          chmod 600 "${key_file}"
          scripts/build/build-release-candidate.sh \
            --destination "${candidate}" \
            --key-file "${key_file}" \
            --external-publication authorized_by_tag
          mkdir dist
          cp "${candidate}"/assets/binary/evalwitness-* dist/
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          candidate_name="$(basename "${candidate}")"
          tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner \
            -C "$(dirname "${candidate}")" -cf - "${candidate_name}" \
            | gzip -n -9 > "dist/${candidate_name}.tar.gz"
          cp "${candidate}/release-manifest.json" dist/
          cp "${candidate}/evalwitness.spdx.json" dist/
          cp "${candidate}/release.intoto.json" dist/
          checksum_stage="${RUNNER_TEMP}/evalwitness-release-SHA256SUMS"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r path; do
              shasum -a 256 "${path}"
            done > "${checksum_stage}"
            mv "${checksum_stage}" SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )
      - name: attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
