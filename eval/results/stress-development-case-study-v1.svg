<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Candidate-order violation reduced to a two-line witness</title><desc id="desc">A provider-free first-listed negative control selects trajectory-a in original order and trajectory-b after reversal. A deterministic 53-attempt replay reduces 32 fixture lines to two and proves one-minimality. Zero empirical units.</desc><style>.bg{fill:#0b0f14}.panel{fill:#121820;stroke:#2a3440;stroke-width:1}.panel-strong{fill:#171f29;stroke:#36424f;stroke-width:1}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.display{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.eyebrow{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.8px;fill:#8f9aa6}.title{font:700 42px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f7f9}.subtitle{font:400 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#9da7b2}.section{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.4px;fill:#c8d0d8}.label{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8f9aa6}.value{font:650 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f7f9}.metric{font:750 72px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4f7f9}.metric-red{fill:#ff5a56}.blue{fill:#2f6cf6}.red{fill:#ff5a56}.cold{fill:#f4f7f9}.muted{fill:#8f9aa6}.rule{stroke:#2a3440;stroke-width:1}.boundary{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4a7a4}.foot{font:400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6f7a86}</style><rect class="bg" width="1400" height="900"/><text class="eyebrow" x="64" y="54">EVALWITNESS / REDUCTION CERTIFICATE / DEVELOPMENT</text><text class="title" x="64" y="110">Candidate-order violation, reduced</text><text class="subtitle" x="64" y="145">One canonical relation. One replay-preserving reducer. One inspectable witness.</text><rect x="1165" y="43" width="171" height="34" rx="17" fill="#2a171a" stroke="#ff5a56"/><text x="1250" y="65" text-anchor="middle" class="mono red" font-size="12" font-weight="700" letter-spacing="1.2">MECHANISM ONLY</text><rect class="panel" x="64" y="190" width="392" height="198" rx="12"/><text class="section" x="88" y="224">ORIGINAL ORDER</text><text class="label" x="88" y="260">trajectory-a  /  trajectory-b</text><text class="value" x="88" y="306">selected  <tspan class="blue">trajectory-a</tspan></text><text class="label" x="88" y="354">first-listed control</text><rect class="panel" x="480" y="190" width="392" height="198" rx="12"/><text class="section" x="504" y="224">REVERSED ORDER</text><text class="label" x="504" y="260">trajectory-b  /  trajectory-a</text><text class="value" x="504" y="306">selected  <tspan class="red">trajectory-b</tspan></text><text class="label" x="504" y="354">relation outcome  <tspan class="red">violated</tspan></text><rect class="panel-strong" x="896" y="190" width="440" height="198" rx="12"/><text class="section" x="920" y="224">REDUCTION</text><text class="metric" x="920" y="312">32 <tspan class="metric-red">-&gt;</tspan> 2</text><text class="label" x="920" y="354">fixture line units · 93.75% removed</text><text class="section" x="64" y="448">REPLAY TRACE</text><text class="label" x="210" y="448">53 attempts · 30 accepted removals · 23 rejected removals</text><text class="label" x="1336" y="448" text-anchor="end">one_minimal · final rejection pass 2/2</text><line class="rule" x1="64" y1="472" x2="1336" y2="472"/><rect class="blue" x="70" y="493" width="14" height="27" rx="2"/><rect class="blue" x="94" y="493" width="14" height="27" rx="2"/><rect class="blue" x="118" y="493" width="14" height="27" rx="2"/><rect class="blue" x="142" y="493" width="14" height="27" rx="2"/><rect class="blue" x="166" y="493" width="14" height="27" rx="2"/><rect class="blue" x="190" y="493" width="14" height="27" rx="2"/><rect class="blue" x="214