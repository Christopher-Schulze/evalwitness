="716">-1</text><text class="value" x="850" y="690">trajectory-b-line-013</text><text class="label" x="850" y="724">scripts/tests/sample-traj-b.txt:13</text><text class="label" x="850" y="754">retained after final attempted removal</text><line class="rule" x1="64" y1="816" x2="1336" y2="816"/><text class="boundary" x="64" y="846">provider-free development mechanism evidence only; zero empirical units; no verifier, provider, population, held-out, or global-minimum claim</text><text class="foot" x="64" y="878">case b4a7adb23505 · canonical JSON is the scientific source · this SVG is a deterministic projection</text></svg>
